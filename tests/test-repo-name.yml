name: Test repo_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: echo "hello world" > /tmp/test-asset-repo-name.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/test-asset-repo-name.txt
          tag: v0.0.1-test-repo-name
          asset_name: test-asset-repo-name.txt
          repo_name: svenstaro/upload-release-action

      - name: Assert action ran (repo_name input exercised, API call expected to fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (repo_name points to a repo without the test tag)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
