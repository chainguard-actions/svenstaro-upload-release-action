name: Test file glob with prerelease and draft flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy files for glob upload
        run: |
          mkdir -p /tmp/glob-test
          echo "file one" > /tmp/glob-test/asset1.txt
          echo "file two" > /tmp/glob-test/asset2.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/glob-test/*.txt
          tag: refs/tags/v0.0.2-test
          file_glob: "true"
          prerelease: "true"
          draft: "true"
      - name: Assert action ran (may fail due to fake token, that is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (error expected with fake token)"
