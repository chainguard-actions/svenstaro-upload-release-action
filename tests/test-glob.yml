name: Test glob upload with file_glob, check_duplicates, prerelease, draft
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.2-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy files for glob upload
        run: |
          mkdir -p /tmp/glob-assets
          echo "asset one" > /tmp/glob-assets/asset1.txt
          echo "asset two" > /tmp/glob-assets/asset2.txt
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
          file: /tmp/glob-assets/*.txt
          tag: refs/tags/v0.0.2-test
          file_glob: "true"
          check_duplicates: "true"
          prerelease: "true"
          draft: "false"
        continue-on-error: true
      - name: Assert action ran (network errors expected in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
