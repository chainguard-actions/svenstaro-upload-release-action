name: Test advanced inputs - promote, repo_name, release_id, check_duplicates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy file to upload
        run: echo "advanced test" > /tmp/advanced-asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/advanced-asset.txt
          tag: refs/tags/v0.0.3-test
          promote: "false"
          repo_name: octocat/hello-world
          release_id: "123456"
          check_duplicates: "true"
      - name: Assert action ran (may fail due to fake token, that is expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (error expected with fake token)"
