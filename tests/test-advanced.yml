name: Test advanced options with promote and release_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file to upload
        run: echo "advanced test content" > /tmp/advanced-asset.bin

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/advanced-asset.bin
          tag: refs/tags/v3.0.0-test
          promote: "false"
          check_duplicates: "true"
          repo_name: octocat/hello-world
          release_id: "123456"

      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
