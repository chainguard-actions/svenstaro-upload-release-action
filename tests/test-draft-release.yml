name: Test draft release upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "draft release artifact" > /tmp/draft-artifact.tar.gz

      - name: Create a git tag for the draft release
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v0.0.1-test-draft || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/draft-artifact.tar.gz
          tag: v0.0.1-test-draft
          asset_name: draft-artifact.tar.gz
          draft: "true"
          prerelease: "true"
          release_name: "Test Draft Release"
          body: "This is a test draft release created by CI."
          overwrite: "true"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.release_id }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
