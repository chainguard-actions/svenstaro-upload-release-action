name: Test draft release upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: echo "draft artifact" > /tmp/draft-artifact.txt

      - name: Run action with draft release inputs (expect failure with invalid token)
        id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: "fake-token-for-testing"
          file: /tmp/draft-artifact.txt
          tag: refs/tags/v0.0.3-test
          release_id: "999999999"
          repo_name: "octocat/Hello-World"
          target_commit: "main"

      - name: Assert action ran (failed gracefully with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected outcome to be 'failure' or 'success', got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran and produced an outcome"
