name: Test file glob upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test files to upload via glob
        run: |
          mkdir -p /tmp/glob-assets
          echo "asset one" > /tmp/glob-assets/asset-1.txt
          echo "asset two" > /tmp/glob-assets/asset-2.txt
          echo "asset three" > /tmp/glob-assets/asset-3.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/glob-assets/*.txt
          tag: v1.0.0-glob-test
          file_glob: "true"
          overwrite: "true"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
