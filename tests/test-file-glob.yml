name: Test file glob upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload via glob
        run: |
          mkdir -p /tmp/artifacts
          echo "artifact one" > /tmp/artifacts/artifact-1.bin
          echo "artifact two" > /tmp/artifacts/artifact-2.bin
          echo "artifact three" > /tmp/artifacts/artifact-3.bin

      - name: Create a git tag for the release
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v0.0.1-test-glob || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/artifacts/*.bin
          tag: v0.0.1-test-glob
          file_glob: "true"
          overwrite: "true"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
