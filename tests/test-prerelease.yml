name: Test prerelease upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "prerelease artifact content" > /tmp/prerelease-artifact.tar.gz

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/prerelease-artifact.tar.gz
          tag: refs/tags/v0.0.4-alpha
          asset_name: prerelease-artifact.tar.gz
          prerelease: "true"
          promote: "false"
          make_latest: "false"
          release_name: "Alpha Pre-release"
          body: "This is an alpha pre-release for testing."
          overwrite: "true"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: prerelease upload succeeded with URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
