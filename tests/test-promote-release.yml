name: Test promote release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy file to upload
        run: echo "promote test" > /tmp/promote-asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/promote-asset.txt
          tag: refs/tags/v0.0.3-test
          promote: "true"
          repo_name: octocat/hello-world
          release_id: "123456"
      - name: Assert action ran (expected to fail due to fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
