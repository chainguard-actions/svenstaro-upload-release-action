name: Test promote release with repo_name and release_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file to upload
        run: echo "promote test content" > /tmp/promote-asset.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/promote-asset.txt
          tag: refs/tags/v2.0.0
          promote: "true"
          repo_name: octocat/hello-world
          release_id: "123456789"

      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with promote, repo_name, and release_id inputs"
