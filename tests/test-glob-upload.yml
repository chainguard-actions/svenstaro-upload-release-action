name: Test glob upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy files to upload via glob
        run: |
          mkdir -p /tmp/release-assets
          echo "asset one" > /tmp/release-assets/asset1.txt
          echo "asset two" > /tmp/release-assets/asset2.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/release-assets/*.txt
          tag: refs/tags/v0.0.2-test
          file_glob: "true"
          prerelease: "true"
          draft: "false"
          check_duplicates: "true"
      - name: Assert action ran (expected to fail due to fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
