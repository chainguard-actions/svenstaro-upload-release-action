name: Test file glob upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test files to upload via glob
        run: |
          mkdir -p /tmp/artifacts
          echo "artifact one" > /tmp/artifacts/artifact-1.bin
          echo "artifact two" > /tmp/artifacts/artifact-2.bin
          echo "artifact three" > /tmp/artifacts/artifact-3.bin

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/artifacts/*.bin
          tag: refs/tags/v0.0.2-test
          file_glob: "true"
          overwrite: "true"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: glob upload succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
