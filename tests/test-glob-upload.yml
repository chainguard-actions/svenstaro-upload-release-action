name: Test glob upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy files to upload via glob
        run: |
          mkdir -p /tmp/glob-assets
          echo "asset one" > /tmp/glob-assets/asset-one.txt
          echo "asset two" > /tmp/glob-assets/asset-two.txt
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
          file: /tmp/glob-assets/*.txt
          tag: refs/tags/v0.0.2-test
          file_glob: "true"
          prerelease: "true"
          draft: "false"
          check_duplicates: "true"
          target_commit: main
        continue-on-error: true
      - name: Assert action ran (may fail due to missing real release)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (network/auth errors are expected in test environment)"
