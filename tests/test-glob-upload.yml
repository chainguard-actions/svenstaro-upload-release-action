name: Test glob pattern upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files to upload via glob
        run: |
          mkdir -p /tmp/release-assets
          echo "binary content 1" > /tmp/release-assets/app-linux-amd64
          echo "binary content 2" > /tmp/release-assets/app-linux-arm64
          echo "binary content 3" > /tmp/release-assets/app-darwin-amd64

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/release-assets/app-*
          tag: v0.0.2-test
          file_glob: "true"
          overwrite: "true"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with glob upload"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
