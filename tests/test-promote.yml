name: Test promote with promote, target_commit, repo_name, release_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.3-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy file to upload
        run: echo "promote test" > /tmp/promote-asset.txt
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
          file: /tmp/promote-asset.txt
          tag: refs/tags/v0.0.3-test
          promote: "false"
          target_commit: "main"
          repo_name: ${{ github.repository }}
          release_id: "0"
        continue-on-error: true
      - name: Assert action ran (network errors expected in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
