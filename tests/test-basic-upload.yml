name: Test basic upload inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy file to upload
        run: echo "hello world" > /tmp/test-asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/test-asset.txt
          tag: refs/tags/v0.0.1-test
          asset_name: test-asset.txt
          overwrite: "true"
          make_latest: "true"
          release_name: "Test Release"
          body: "This is a test release body."
          target_commit: main
          repo_name: ${{ github.repository }}
      - name: Assert action ran (expected to fail with fake token)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (success or failure with fake credentials is acceptable)"
