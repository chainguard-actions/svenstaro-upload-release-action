name: Test basic upload with asset_name and release options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file to upload
        run: echo "test content" > /tmp/test-asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/test-asset.txt
          tag: refs/tags/v1.0.0-test
          asset_name: test-asset.txt
          overwrite: "true"
          make_latest: "true"
          release_name: "Test Release"
          body: "This is a test release body."
          target_commit: main
      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS: all inputs were accepted"
