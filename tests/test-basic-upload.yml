name: Test basic upload with asset_name and release options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test file to upload
        run: echo "test content" > /tmp/test-asset.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/test-asset.txt
          tag: refs/tags/v1.0.0
          asset_name: test-asset.txt
          overwrite: "true"
          make_latest: "true"
          release_name: "Test Release"
          body: "This is a test release body"
          target_commit: main

      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake token (API call will fail)
          # but we verify it was invoked with all inputs correctly
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with all required inputs"
