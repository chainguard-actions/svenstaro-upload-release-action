name: Test basic upload with asset_name and body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file
        run: echo "hello world" > /tmp/test-asset.txt
      - id: action
        uses: .
        with:
          repo_token: fake-token-for-testing
          file: /tmp/test-asset.txt
          tag: v1.0.0
          asset_name: test-asset.txt
          overwrite: "true"
          make_latest: "true"
          release_name: "Test Release"
          body: "This is a test release body"
          target_commit: main
          repo_name: octocat/Hello-World
        continue-on-error: true
      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS: inputs were accepted by the action"
