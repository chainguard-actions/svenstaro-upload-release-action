name: Test basic upload with named asset
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file
        run: echo "hello world" > /tmp/test-asset.txt
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
          file: /tmp/test-asset.txt
          asset_name: my-test-asset.txt
          tag: refs/tags/v0.0.1-test
          release_name: Test Release
          body: "This is a test release body"
          draft: "true"
          make_latest: "false"
        continue-on-error: true
      - name: Assert action ran (may fail due to missing release/auth in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
