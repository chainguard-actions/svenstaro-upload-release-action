name: Test basic upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy file to upload
        run: echo "hello world" > /tmp/test-asset.txt
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
          file: /tmp/test-asset.txt
          tag: refs/tags/v0.0.1-test
          asset_name: test-asset.txt
          overwrite: "true"
          make_latest: "true"
          release_name: "Test Release"
          body: "This is a test release body."
          target_commit: main
        continue-on-error: true
      - name: Assert action ran (API call expected to fail in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
