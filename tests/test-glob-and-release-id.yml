name: Test glob and release_id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy files to upload via glob
        run: |
          mkdir -p /tmp/release-assets
          echo "asset one" > /tmp/release-assets/asset1.txt
          echo "asset two" > /tmp/release-assets/asset2.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: fake-token-for-testing
          file: /tmp/release-assets/*.txt
          tag: refs/tags/v0.0.2-test
          file_glob: "true"
          release_id: "999999999"

      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake token/repo
          # We just verify it was invoked and produced an outcome
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
