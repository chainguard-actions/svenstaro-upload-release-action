name: Test release_id and repo_name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: echo "release id test content" > /tmp/release-id-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/release-id-artifact.txt
          tag: refs/tags/v0.0.3-test
          asset_name: release-id-artifact.txt
          release_id: "999999999"
          repo_name: ${{ github.repository }}

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
          RELEASE_ID: ${{ steps.action.outputs.release_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          echo "release_id: $RELEASE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or invalid release_id is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
