name: Test advanced options including promote, release_id, repo_name, target_commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file
        run: echo "advanced test" > /tmp/advanced-asset.txt
      - id: action
        uses: .
        with:
          repo_token: ${{ github.token }}
          file: /tmp/advanced-asset.txt
          tag: refs/tags/v0.0.3-test
          promote: "false"
          release_id: "0"
          repo_name: ${{ github.repository }}
          target_commit: main
        continue-on-error: true
      - name: Assert action ran (may fail due to missing release/auth in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
