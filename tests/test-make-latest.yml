name: Test make_latest and check_duplicates inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: echo "test content" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo_token: ${{ github.token }}
          file: /tmp/test-artifact.txt
          tag: refs/tags/v0.0.1-test
          asset_name: test-artifact.txt
          make_latest: "true"
          check_duplicates: "true"
          target_commit: ${{ github.sha }}

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
